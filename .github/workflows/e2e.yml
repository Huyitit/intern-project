          cd ../Playwright-Test && npm ci

      # ── Database Setup ─────────────────────────────────────────────
      - name: Cache MySQL Docker Image
        id: cache-mysql-image
        uses: actions/cache@v4
        with:
          path: ~/.docker-mysql-image
          key: ${{ runner.os }}-docker-mysql-8

      - name: Load or Pull MySQL Docker Image
        run: |
          if [ -f ~/.docker-mysql-image/mysql8.tar ]; then
