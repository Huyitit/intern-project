          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_DATABASE || 'test_db' }}

      # ── Playwright Setup ───────────────────────────────────────────
      - name: Restore Playwright Browsers Cache
        id: playwright-cache
