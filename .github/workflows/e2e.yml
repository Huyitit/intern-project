      - name: Install Playwright Browsers if Cache Miss
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: cd Playwright-Test && npx playwright install --with-deps

      # ── Run E2E Tests ──────────────────────────────────────────────
      - name: Run E2E Tests
        run: cd Playwright-Test && npx playwright test --project="hard-e2e-test"
        env:
          BASE_URL: ${{ secrets.BASE_URL || 'http://127.0.0.1:3000' }}
          UI_BASE_URL: ${{ secrets.UI_BASE_URL || 'http://127.0.0.1:5173'}}
          DB_HOST: 127.0.0.1
